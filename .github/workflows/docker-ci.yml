name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t docker-demo:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
            -p 8080:8080 \
            --name docker-demo-container \
            docker-demo:${{ github.sha }}

      - name: Test application
        run: |
          sleep 3
          curl --fail http://localhost:8080

      - name: Show container logs
        if: failure()
        run: |
          docker logs docker-demo-container

      - name: Stop container
        if: always()
        run: |
          docker stop docker-demo-container || true
          docker rm docker-demo-container || true
