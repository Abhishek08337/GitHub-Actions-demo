name: artifacts and paths
on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: creating
        run: echo "Hi This is a artitfact from abhi build" > build.txt

      - name: uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: build file
          path: build.txt

  Test-Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: download stage
        uses: actions/download-artifact@v4
        with:
          name: build file

      - name: test-deploy
        run: |
          cat build.txt
          echo "workflow successful"
