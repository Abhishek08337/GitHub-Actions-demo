name: matrix-build
on:
  workflow_dispatch: 

jobs:
  matrix-:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - windows
          - linux
          - mac os
        
        version:
          - 1.4
          - 3.2
          
    steps:
      - name: show version
        run: |
          echo "Testing Version Is ${{ matrix.version }}"
          echo "Testing running on ${{ matrix.os }}"

      - name: if
        if: matrix.os == 'linux'
        run: echo "Running on linux specific step"
